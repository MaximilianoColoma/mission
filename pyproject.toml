[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mission-public"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["fastmcp>=3.4.7", "cryptography>=45"]

[dependency-groups]
dev = ["pytest>=9,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mission_public = ["request-schemas.json"]

[tool.pytest.ini_options]
# Makes the acceptance command reproducible without an external PYTHONPATH.
pythonpath = ["src"]